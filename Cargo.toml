[package]
name = "siegecastle"
version = "0.1.0"
edition = "2024"
description = "A fast medieval action roguelike: drive a growing castle and survive the siege."
license = "MIT"

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["2d", "ui", "png"] }
rand = { version = "0.9", features = ["small_rng"] }

# Fast-ish debug builds: optimize Bevy itself, keep our code quick to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
